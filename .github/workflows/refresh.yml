name: Refresh holdings

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holdings-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt
      - name: Install exact reviewed dependencies
        run: >-
          python -m pip install -c constraints-ci.txt setuptools &&
          python -m pip install --no-build-isolation -c constraints-ci.txt -e ".[test,browser]"
      - name: Install Playwright Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run full test suite
        run: python -m pytest
      - name: Select latest staged official MNZL export
        id: mnzl
        shell: bash
        run: |
          set -euo pipefail
          fallback="$(printf '%s\n' sources/mnzl-official-holdings-????-??-??.csv | sort | tail -n 1)"
          test -f "$fallback"
          printf 'fallback=%s\n' "$fallback" >> "$GITHUB_OUTPUT"
      - name: Refresh fail-closed generation
        run: >-
          python -m shariah_holdings.cli --output-dir data
          --mnzl-fallback-csv "${{ steps.mnzl.outputs.fallback }}"
      - name: Verify generated API snapshot and floors
        run: python scripts/verify_generation.py --data-dir data
      - name: Create verifiable publication artifact
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > refresh-base.txt
          find data -type f ! -name .publish.lock -print0 | sort -z | xargs -0 sha256sum > generated-data.sha256
      - name: Upload generated data
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: generated-data
          path: |
            data
            refresh-base.txt
            generated-data.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download generated data
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: generated-data
          path: artifact
      - name: Verify artifact and unchanged branch
        shell: bash
        run: |
          set -euo pipefail
          (cd artifact && sha256sum -c generated-data.sha256)
          test "$(cat artifact/refresh-base.txt)" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          test "$(cat artifact/refresh-base.txt)" = "$(git rev-parse FETCH_HEAD)"
          rm -rf data
          cp -a artifact/data data
      - name: Commit actual generated data changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code -- data &&
             test -z "$(git ls-files --others --exclude-standard -- data)"; then
            echo "Generated data is unchanged; nothing to commit."
            exit 0
          fi
          git add -- data
          git diff --cached --quiet --exit-code && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh validated holdings"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push data commit with ephemeral token
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
