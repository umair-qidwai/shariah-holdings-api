[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shariah-holdings"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.46,<2"]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "pyyaml>=6,<7"]

[project.scripts]
shariah-holdings-refresh = "shariah_holdings.cli:run"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shariah_holdings = ["templates/*.html"]
